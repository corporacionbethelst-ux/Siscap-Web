# ============================================================
# SISCAP Web — Nginx reverse proxy de producción (SSL + rate limiting)
# Monta: frontend estático + proxy al backend Gunicorn.
# Certificados: nginx/ssl/{fullchain.pem, privkey.pem} (no versionados).
# ============================================================

# Zona de rate limiting para endpoints de autenticación (mitiga fuerza bruta)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Rate limit general para la API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream siscap_backend {
    server backend:8000;
    keepalive 32;
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 15M;  # coherente con MAX_UPLOAD_SIZE_MB=10 + margen

    # Frontend SPA (archivos compilados de Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con cache largo (nombre hasheado por Vite)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Login: rate limit estricto
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://siscap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API general
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://siscap_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentación de API solo detrás de VPN/firewall si no es pública
    location /docs {
        proxy_pass http://siscap_backend;
        proxy_set_header Host $host;
    }
}

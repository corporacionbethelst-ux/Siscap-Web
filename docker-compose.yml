
services:
  db:
    image: postgres:15-alpine
    container_name: siscap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: siscap_user
      POSTGRES_PASSWORD: siscap_secure_password_2026
      POSTGRES_DB: siscap_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siscap_user -d siscap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: siscap_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads    # ← NUEVO: Volumen persistente para archivos
    environment:
      DATABASE_URL: postgresql://siscap_user:siscap_secure_password_2026@db:5432/siscap_db
      SECRET_KEY: cambia_esto_por_una_clave_muy_segura_de_64_caracteres
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      UPLOAD_DIR: /app/uploads        # ← NUEVO: Ruta de uploads
      MAX_UPLOAD_SIZE_MB: 10          # ← NUEVO: Tamaño máximo de archivo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: siscap_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: siscap_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siscap.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  uploads_data:    # ← NUEVO: Volumen para archivos subidos
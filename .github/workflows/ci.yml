name: CI SISCAP Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.17.3 mypy==1.8.0

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Mypy (type-check, modo tolerante)
        run: mypy app --ignore-missing-imports --follow-imports=skip || echo "::warning::mypy reporta errores — no bloquea el build aún"

      - name: Pytest (RBAC + reglas de negocio + smoke rutas)
        run: python -m pytest tests -q

  frontend:
    name: Frontend (tsc strict + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalación limpia (npm ci)
        run: npm ci

      - name: Type-check estricto
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

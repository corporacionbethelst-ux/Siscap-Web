[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    smoke: pruebas de humo (carga de app e inventario de rutas OpenAPI)
    rbac: matriz de roles y permisos (RBAC Sala Situacional / operativo)
    negocio: reglas de negocio críticas (bloqueo exclusivo, override ADMIN, auditoría)
filterwarnings =
    ignore::DeprecationWarning

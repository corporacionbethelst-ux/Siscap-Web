# ============================================================
# SISCAP Web — Composición de PRODUCCIÓN
# Uso:
#   1. cp .env.production .env.production.local y complete secretos
#   2. docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
# Secretos SIEMPRE desde variables de entorno; NUNCA hardcodeados aquí.
# ============================================================

services:
  db:
    image: postgres:15-alpine
    container_name: siscap_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-siscap_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-siscap_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [siscap_net]
    # NO exponer puertos al host en producción (solo red interna)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: siscap_backend_prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siscap_db}
      DEBUG: "false"
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [siscap_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: siscap_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    networks: [siscap_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: siscap_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks: [siscap_net]

networks:
  siscap_net:
    driver: bridge

volumes:
  postgres_prod_data:
  uploads_prod:
